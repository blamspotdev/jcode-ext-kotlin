id: jcode.lang.kotlin
name: Kotlin Dev Pack
publisher: jcode
version: 0.1.4
type: language
# The Kotlin language server installs automatically as a requirement so coloring/completions work out of
# the box; the JDK (which also powers the ktlint formatter) and java-debug (JDWP) are suggested — opt-in
# installs rather than one-shot requirements.
requires:
  lsps: [kotlin-language-server]
suggests:
  sdks: [jdk]
  dbg: [java-debug]
description: Coloring, completions, snippets, and a basic formatter for Kotlin.
languages:
  - kotlin
# --- header fields merged from extension.jehm ---
shortDescription: Coloring, completions, snippets, and a basic formatter for Kotlin.
minJCodeVersion: 1.0.0
targetJCodeVersion: 1.0.0
category: Languages
subcategory: Kotlin
images:
  icon: media/icon.png
  samples: []
  walkthrough: []
entry:
  manifest: extension.yaml
  ui: null
  libs: []
